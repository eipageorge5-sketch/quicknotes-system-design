<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes API Client</h1>
    </header>

    <main>
        <!-- Task 1: Load Notes -->
        <section class="controls">
            <button id="load-btn">Load Notes</button>
            <p id="status"></p>
        </section>

        <!-- Task 2: Create Note -->
        <section class="form-section">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <label for="title-input">Title (Required, max 100 chars):</label>
                <input type="text" id="title-input" maxlength="100" required>
                
                <label for="body-input">Body (Optional):</label>
                <textarea id="body-input" rows="4"></textarea>
                
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <!-- Task 1 & 3: Notes List -->
        <section class="list-section">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
